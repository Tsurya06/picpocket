<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 440" width="100%" height="auto" style="border-radius: 16px; overflow: hidden; background: #0c0e14;">
  <defs>
    <linearGradient id="bgGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141926" />
      <stop offset="50%" stop-color="#0d111a" />
      <stop offset="100%" stop-color="#080a0f" />
    </linearGradient>

    <radialGradient id="cyanOrb" cx="15%" cy="20%" r="45%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.22" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="indigoOrb" cx="85%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="emeraldOrb" cx="50%" cy="85%" r="40%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#10b981" stop-opacity="0" />
    </radialGradient>

    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="50%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#93c5fd" />
    </linearGradient>

    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>

    <linearGradient id="iconBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#000000" flood-opacity="0.6" />
    </filter>

    <filter id="glowBadge" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="glow" />
      <feComposite in="SourceGraphic" in2="glow" operator="over" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="440" fill="url(#bgGlow)" />
  <rect width="1200" height="440" fill="url(#cyanOrb)" />
  <rect width="1200" height="440" fill="url(#indigoOrb)" />
  <rect width="1200" height="440" fill="url(#emeraldOrb)" />

  <!-- Subtle Grid Accent -->
  <g opacity="0.06" stroke="#ffffff" stroke-width="1">
    <line x1="0" y1="80" x2="1200" y2="80" />
    <line x1="0" y1="160" x2="1200" y2="160" />
    <line x1="0" y1="240" x2="1200" y2="240" />
    <line x1="0" y1="320" x2="1200" y2="320" />
    <line x1="0" y1="400" x2="1200" y2="400" />
    <line x1="160" y1="0" x2="160" y2="440" />
    <line x1="320" y1="0" x2="320" y2="440" />
    <line x1="480" y1="0" x2="480" y2="440" />
    <line x1="640" y1="0" x2="640" y2="440" />
    <line x1="800" y1="0" x2="800" y2="440" />
    <line x1="960" y1="0" x2="960" y2="440" />
    <line x1="1120" y1="0" x2="1120" y2="440" />
  </g>

  <!-- Border Frame -->
  <rect x="1" y="1" width="1198" height="438" rx="15" fill="none" stroke="#252d3d" stroke-width="1.5" />

  <!-- Logo Mark + Glow -->
  <g transform="translate(100, 85)" filter="url(#shadow)">
    <!-- Icon Container Box -->
    <rect width="110" height="110" rx="26" fill="url(#iconBg)" stroke="#38455d" stroke-width="2" />
    
    <!-- Telegram Paper Plane Wing Motif -->
    <path d="M 28 55 L 82 28 L 68 84 L 52 64 Z" fill="none" stroke="#38bdf8" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round" />
    <path d="M 52 64 L 62 48" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" />
    
    <!-- Lock / Security Badge Overlay -->
    <rect x="58" y="58" width="34" height="28" rx="7" fill="#0f172a" stroke="#6366f1" stroke-width="2.5" />
    <path d="M 66 58 L 66 51 C 66 45 84 45 84 51 L 84 58" fill="none" stroke="#a855f7" stroke-width="2.5" stroke-linecap="round" />
    <circle cx="75" cy="71" r="3" fill="#38bdf8" />
  </g>

  <!-- Header Typography -->
  <g transform="translate(240, 115)">
    <!-- Brand Title -->
    <text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="800" font-size="54" fill="url(#titleGrad)" letter-spacing="-1">PicPocket</text>

    <!-- Version & Zero-Knowledge Badge -->
    <g transform="translate(270, -38)">
      <rect x="0" y="0" width="158" height="26" rx="13" fill="#1e293b" stroke="#38bdf8" stroke-width="1.2" stroke-opacity="0.8" />
      <circle cx="14" cy="13" r="4" fill="#38bdf8" />
      <text x="26" y="17" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-weight="600" font-size="11" fill="#e2e8f0" letter-spacing="0.5">ZERO-KNOWLEDGE</text>
    </g>

    <g transform="translate(440, -38)">
      <rect x="0" y="0" width="134" height="26" rx="13" fill="#1e293b" stroke="#10b981" stroke-width="1.2" stroke-opacity="0.8" />
      <circle cx="14" cy="13" r="4" fill="#10b981" />
      <text x="26" y="17" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-weight="600" font-size="11" fill="#e2e8f0" letter-spacing="0.5">MTPROTO DIRECT</text>
    </g>

    <!-- Subtitle / Mission Statement -->
    <text x="2" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="400" font-size="20" fill="#94a3b8">
      Private, client-side Google Photos–style gallery backed by your own Telegram channels.
    </text>

    <text x="2" y="74" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="400" font-size="15" fill="#64748b">
      Zero backend. Zero telemetry. 100% encrypted in your browser before upload.
    </text>
  </g>

  <!-- Feature Pillar Badges / Cards across the bottom -->
  <g transform="translate(100, 260)">
    <!-- Card 1: Web Crypto -->
    <g transform="translate(0, 0)">
      <rect width="235" height="120" rx="14" fill="#131824" stroke="#252d3d" stroke-width="1.2" />
      <circle cx="36" cy="36" r="16" fill="#1e293b" />
      <path d="M 30 36 L 36 30 L 42 36 M 36 32 L 36 42" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="64" y="34" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-weight="700" font-size="14" fill="#f1f5f9">AES-256-GCM</text>
      <text x="64" y="50" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-weight="500" font-size="11" fill="#38bdf8">PBKDF2 · 600k rounds</text>
      <text x="20" y="82" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" fill="#94a3b8">Keys never leave the Web</text>
      <text x="20" y="100" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" fill="#94a3b8">Worker. Non-extractable.</text>
    </g>

    <!-- Card 2: 32MB Packing -->
    <g transform="translate(255, 0)">
      <rect width="235" height="120" rx="14" fill="#131824" stroke="#252d3d" stroke-width="1.2" />
      <circle cx="36" cy="36" r="16" fill="#1e293b" />
      <rect x="29" y="29" width="14" height="14" rx="3" fill="none" stroke="#6366f1" stroke-width="2"/>
      <text x="64" y="34" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-weight="700" font-size="14" fill="#f1f5f9">32 MB Bundles</text>
      <text x="64" y="50" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-weight="500" font-size="11" fill="#818cf8">4 KB Range Downloads</text>
      <text x="20" y="82" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" fill="#94a3b8">Packs small items together.</text>
      <text x="20" y="100" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" fill="#94a3b8">Streams exact byte offsets.</text>
    </g>

    <!-- Card 3: Anti-Ban Protection -->
    <g transform="translate(510, 0)">
      <rect width="235" height="120" rx="14" fill="#131824" stroke="#252d3d" stroke-width="1.2" />
      <circle cx="36" cy="36" r="16" fill="#1e293b" />
      <path d="M 30 36 C 30 30 42 30 42 36 C 42 41 33 41 33 44" fill="none" stroke="#10b981" stroke-width="2" stroke-linecap="round"/>
      <circle cx="36" cy="42" r="1" fill="#10b981"/>
      <text x="64" y="34" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-weight="700" font-size="14" fill="#f1f5f9">Anti-Ban Queue</text>
      <text x="64" y="50" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-weight="500" font-size="11" fill="#34d399">FloodWait + Jitter</text>
      <text x="20" y="82" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" fill="#94a3b8">Paced write lanes &amp; albums</text>
      <text x="20" y="100" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" fill="#94a3b8">prevent account bans.</text>
    </g>

    <!-- Card 4: WhatsApp & PWA -->
    <g transform="translate(765, 0)">
      <rect width="235" height="120" rx="14" fill="#131824" stroke="#252d3d" stroke-width="1.2" />
      <circle cx="36" cy="36" r="16" fill="#1e293b" />
      <path d="M 30 42 L 34 32 L 42 34 L 40 42 Z" fill="none" stroke="#f59e0b" stroke-width="2" stroke-linejoin="round"/>
      <text x="64" y="34" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-weight="700" font-size="14" fill="#f1f5f9">PWA &amp; WhatsApp</text>
      <text x="64" y="50" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-weight="500" font-size="11" fill="#fbbf24">Offline Shell + Backup</text>
      <text x="20" y="82" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" fill="#94a3b8">Native OS Share Target</text>
      <text x="20" y="100" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" fill="#94a3b8">and folder database sync.</text>
    </g>
  </g>
</svg>

