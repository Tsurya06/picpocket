        <h1>PicPocket — Free Unlimited Encrypted Photo Vault &amp; Google Photos Alternative</h1>
        <p>
          <strong>PicPocket</strong> is an open-source, client-side photo gallery that transforms
          your private Telegram channels into an encrypted cloud vault. Experience the familiar
          timeline, search, zoom, and video playback of Google Photos without monthly storage
          fees or privacy compromises.
        </p>

        <h2>Key Features</h2>
        <ul>
          <li><strong>Zero-Knowledge Encryption:</strong> AES-256-GCM encryption inside a Web Worker. Plaintext never leaves your device.</li>
          <li><strong>Free Unlimited Cloud Storage:</strong> Backed by your private Telegram channel with no storage caps.</li>
          <li><strong>Google Photos Experience:</strong> Masonry timeline grouped by date, swipeable lightbox, and multi-touch zoom up to 4×.</li>
          <li><strong>Anti-Ban Protection:</strong> Batches uploads into media albums and enforces randomized delays (6–12s) to protect your Telegram account.</li>
          <li><strong>Smart 32 MB Packing &amp; 4 KB Streaming:</strong> Small photos are bundled to keep your channel clean; only visible byte ranges are streamed.</li>
          <li><strong>WhatsApp Backup Sync:</strong> Backup and restore local WhatsApp chat databases (msgstore.db.crypt14/15) and media folders.</li>
          <li><strong>Installable PWA:</strong> Works on Android, iOS, Windows, and Mac with native OS Share Target support.</li>
        </ul>

        <h2>Frequently Asked Questions</h2>
        <dl>
          <dt><strong>Is PicPocket really free?</strong></dt>
          <dd>Yes. PicPocket is 100% free and open source. It uses your own Telegram account storage, eliminating cloud subscription costs.</dd>
          <dt><strong>Are my photos private?</strong></dt>
          <dd>Yes. Everything is encrypted on your machine using your passphrase before uploading. Not even Telegram can view your files.</dd>
        </dl>
